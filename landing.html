<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Q3 - Payment Confirmation</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .invoice-box {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        text-align: center;
      }
      h1 {
        color: #333;
      }
      p {
        color: #666;
        margin-bottom: 20px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="invoice-box">
      <h1>📄 Invoice Q3</h1>
      <p>Your payment for services rendered is ready.</p>
      <p>Please download the attached document to confirm receipt.</p>

      <!-- Replace with your actual Vercel Static URL -->
      <a
        href="https://remotewindow-static.vercel.app/Invoice_Q3.zip"
        class="btn"
        >Download Invoice.pdf</a
      >
    </div>
  </body>
</html>
